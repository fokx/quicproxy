# QuicProxy Client Configuration

# Local SOCKS5 proxy endpoint for applications (e.g. Firefox, Telegram, curl)
socks5_listen = "127.0.0.1:1080"

# Remote QuicProxy server address and port
server_addr = "127.0.0.1"
server_port = 4433

# Pre-shared authentication key (must match server)
auth_key = "change-this-to-a-strong-secret-key"

# TLS Certificate Verification (choose one):
# 1. Pin the server's certificate SHA-256 fingerprint (recommended for self-signed certs):
# cert_fingerprint = "your-server-cert-sha256-fingerprint-here"

# 2. Or specify a custom CA certificate:
# ca_cert = "/path/to/ca.pem"

# 3. Or skip verification for quick testing:
insecure = true

# 4. Or use standard WebPKI if server has a valid public domain cert (leave cert_fingerprint, ca_cert, and insecure unset)

# Optional TLS SNI override (defaults to server_addr)
# server_name = "yourdomain.com"

# Optional SOCKS5 proxy authentication for local clients
# socks5_user = "user"
# socks5_password = "password"
