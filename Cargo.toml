[package]
name = "quicproxy"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance, censorship-resistant QUIC and TCP fallback proxy with SOCKS5 interface"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/fokx/quicproxy"
keywords = ["quic", "socks5", "proxy", "anti-censorship", "tunnel"]
categories = ["network-programming", "command-line-utilities"]
exclude = [
    "PLAN_AND_STATUS_PHASE_2_4.md",
]

[dependencies]
anyhow = "1.0.104"
blake2 = "0.11.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
idna = "1.1.0"
igd-next = "0.17.1"
ipnet = "2.12.2"
lru = "0.18.5"
percent-encoding = "2.3.2"
prost = "0.14.4"
quinn = "0.11.12"
rand = "0.10.3"
rcgen = "0.14.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
ring = "0.17.14"
rustls = "0.23.45"
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
